<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Financial App</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/90Gnp39P/gemini-svg-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f5f6; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <!-- Masukkan URL Web App Google Apps Script Anda yang berakhiran /exec di bawah ini -->
  <iframe src="https://script.google.com/macros/s/AKfycbxuKtPcROeCHI0rX4Sn60FZAWFv0stCQ_92fOoQ8lv7tlWv6tKfRJtGhdyj3Emc_XUh/exec"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      // Untuk mencegah Service Worker memblokir request ke Google Script, 
      // kita biarkan kosong atau unregister jika error berlanjut.
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</body>
</html>
