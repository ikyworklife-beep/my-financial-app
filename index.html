<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Financial App</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d0e26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0e26; }
    iframe { width: 100%; height: 100%; border: none; display: block; background: #0d0e26; }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbylMZM4VOMm71TLz8T3eeXE2fL4Bq-Y6EjbqOcR5gJsj5pg6ks2fOSB3mYhHINfEZ1Z/exec"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
